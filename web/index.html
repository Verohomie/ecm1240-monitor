<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy Monitor</title>
<!-- Inline SVG favicon as a data URI: no binary asset to ship, no second
     request, and no 404 in the log on every page load. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a6fa8'/%3E%3Cpath d='M18 4 8 18h6l-2 10 10-14h-6z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* The circuit list, site name and rate all come from /api/config — nothing
   about any particular house is hardcoded in this file.

   No JavaScript dependencies: the charts below are hand-written SVG, including
   the drag-to-zoom. That keeps the whole application auditable by anyone who
   wants to read what runs on their own network. */
:root {
  --bg: #0f1720; --panel: #17212b; --panel2: #1e2b38; --line: #2c3d4d;
  --fg: #e8eef4; --dim: #9fb2c4; --accent: #4ea8de; --ok: #4cc38a;
  --warn: #e8a33d; --alert: #e5624a; --pending: #6b7f92;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #eef2f6; --panel: #fff; --panel2: #f4f7fa; --line: #d3dde6;
    --fg: #16222e; --dim: #5a6b7c; --accent: #1a6fa8; --ok: #1f8f5f;
    --warn: #b26a00; --alert: #c0392b; --pending: #8496a6;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  padding-bottom: 40px; -webkit-text-size-adjust: 100%;
}
header {
  background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 18px 20px; position: sticky; top: 0; z-index: 10;
}
h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.2px; }
.sub { font-size: 14px; color: var(--dim); margin-top: 3px; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px; }
.hero {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 22px; margin: 18px 0; text-align: center; cursor: pointer;
}
.hero:hover, .hero:focus-visible { border-color: var(--accent); outline: none; }
.hero .big { font-size: 46px; font-weight: 700; letter-spacing: -1px; }
.hero .lbl { font-size: 15px; color: var(--dim); text-transform: uppercase;
             letter-spacing: 1px; }
.hero .cost { font-size: 16px; color: var(--dim); margin-top: 8px; }
.hero .unmet { font-size: 15px; color: var(--dim); margin-top: 6px; }
.hero .unmet b { color: var(--fg); font-weight: 600; }
.hero .hint { font-size: 13px; color: var(--dim); margin-top: 10px; opacity: .8; }
h2 { font-size: 16px; margin: 26px 0 12px; color: var(--dim);
     text-transform: uppercase; letter-spacing: 1px; }
.grid { display: grid; gap: 12px;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; cursor: pointer; transition: border-color .15s;
}
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
.card .name { font-size: 16px; font-weight: 600; }
.card .w { font-size: 28px; font-weight: 700; margin: 4px 0 2px; }
.card .meta { font-size: 14px; color: var(--dim); }
.bar { height: 6px; background: var(--panel2); border-radius: 3px;
       margin-top: 10px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.card.hidden-ch { opacity: .55; }
.tag { display: inline-block; font-size: 12px; padding: 2px 7px;
       border-radius: 4px; background: var(--panel2); color: var(--dim);
       margin-left: 6px; vertical-align: 2px; }
.ins { background: var(--panel); border: 1px solid var(--line);
       border-left: 4px solid var(--pending); border-radius: 8px;
       padding: 13px 16px; margin-bottom: 10px; }
.ins.ok { border-left-color: var(--ok); }
.ins.watch { border-left-color: var(--warn); }
.ins.alert { border-left-color: var(--alert); }
.ins.info { border-left-color: var(--pending); }
.ins .t { font-size: 16px; font-weight: 600; }
.ins .d { font-size: 14px; color: var(--dim); margin-top: 4px;
          white-space: pre-wrap; }

/* ── chart view ─────────────────────────────────────────────────────────── */
#chartView { display: none; }
body.charting #chartView { display: block; }
body.charting #dash { display: none; }
.back {
  display: inline-flex; align-items: center; gap: 7px; font-size: 15px;
  color: var(--accent); cursor: pointer; background: none; border: none;
  padding: 6px 0; margin: 14px 0 4px;
}
.chartHead { display: flex; align-items: baseline; justify-content: space-between;
             flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.chartHead h2 { margin: 0; color: var(--fg); font-size: 22px;
                text-transform: none; letter-spacing: -0.2px; }
.ranges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
button {
  font: inherit; font-size: 15px; background: var(--panel2); color: var(--fg);
  border: 1px solid var(--line); border-radius: 7px; padding: 8px 14px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button[aria-pressed="true"] { background: var(--accent); color: #fff;
                              border-color: var(--accent); }
.plotWrap { background: var(--panel); border: 1px solid var(--line);
            border-radius: 10px; padding: 14px 14px 10px; }
svg { display: block; width: 100%; height: auto; touch-action: none; }
.zoomNote { font-size: 14px; color: var(--dim); margin-top: 8px;
            display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.stats { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 14px;
         font-size: 15px; }
.err { background: var(--panel); border: 1px solid var(--alert);
       border-radius: 10px; padding: 16px; color: var(--fg); font-size: 15px; }
footer { text-align: center; color: var(--dim); font-size: 13px; margin-top: 34px; }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
       background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1 id="site">Energy Monitor</h1>
    <div class="sub" id="status">connecting…</div>
  </div>
</header>

<div class="wrap">
  <div id="boot"></div>

  <!-- Chart view: replaces the dashboard, at its own address (#/chart/…) so
       the browser Back button and touch back-swipe both work. -->
  <div id="chartView">
    <button class="back" onclick="closeChart()">← Back</button>
    <div class="chartHead">
      <h2 id="chartTitle">Chart</h2>
      <div id="chartNow" style="font-size:19px;font-weight:700"></div>
    </div>
    <div class="ranges" id="ranges"></div>
    <div class="plotWrap">
      <div id="plot"></div>
      <div class="zoomNote">
        <span id="zoomLbl"></span>
        <span id="zoomHint">Drag across the chart to zoom · drag the strip to pan · scroll to zoom</span>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div id="dash">
    <div class="hero" id="hero" hidden tabindex="0">
      <div class="lbl" id="heroLbl">Whole House</div>
      <div class="big" id="heroW">—</div>
      <div class="cost" id="heroCost"></div>
      <div class="unmet" id="heroUnmet" hidden></div>
      <div class="hint">Tap for a zoomable chart</div>
    </div>

    <h2>Circuits</h2>
    <div class="grid" id="grid"></div>

    <!-- One row per meter, showing what it reads on its own supply. Each is a
         door into that meter's voltage history: with two meters on the same
         service the pair should track, and one drifting away from the other is
         the earliest sign that a meter's voltage electronics are failing. -->
    <h2 id="voltH" hidden>Line voltage</h2>
    <div class="grid" id="volts"></div>

    <h2 id="insH" hidden>Insights</h2>
    <div id="ins"></div>
  </div>

  <footer>ecm1240-monitor · data stays on this machine</footer>
</div>

<script>
'use strict';

const API = location.origin.startsWith('http') ? location.origin : 'http://127.0.0.1:8080';
const RANGES = [
  { label: '1 h',  minutes: 60 },
  { label: '3 h',  minutes: 180 },
  { label: '6 h',  minutes: 360 },
  { label: '12 h', minutes: 720 },
  { label: '24 h', minutes: 1440 },
  { label: '3 d',  minutes: 4320 },
  { label: '7 d',  minutes: 10080 },
  { label: '30 d', minutes: 43200 },
];
/* Look a default range up by its LABEL, never by its position — inserting a
   range would otherwise move every default along one, silently. */
const rangeByLabel = label => Math.max(RANGES.findIndex(r => r.label === label), 0);
const DEFAULT_RANGE = rangeByLabel('24 h');
const MIN_SPAN_S = 120;          // do not let a zoom go below two minutes

let CFG = null;
let LAST = {};                   // unit -> latest reading row

const $ = id => document.getElementById(id);
const fmtW = w => w == null ? '—'
  : (Math.abs(w) >= 1000 ? (w / 1000).toFixed(2) + ' kW' : Math.round(w) + ' W');
// One decimal: the swings worth seeing on a service are fractions of a volt,
// and rounding them away is what makes a voltage chart look like a flat line.
const fmtV = v => v == null ? '—' : v.toFixed(1) + ' V';

/* The service-voltage band comes from the server (config `voltage:`) so a 230 V
   service is a config edit, not a code edit, and the chart cannot disagree with
   the insights rule about what "in range" means. */
const voltBand = () => (CFG && CFG.voltage) || { low: 114, high: 126, dead_below: 90 };
const deadBelow = () => voltBand().dead_below ?? 90;

async function get(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(path + ' -> HTTP ' + r.status);
  return r.json();
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}
function fmtTime(t, spanS) {
  const d = new Date(t * 1000);
  if (spanS > 3 * 86400) return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  if (spanS > 86400) return d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric' });
  return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}
function fmtSpan(s) {
  if (s < 5400) return Math.round(s / 60) + ' min';
  if (s < 3 * 86400) return (s / 3600).toFixed(s < 36000 ? 1 : 0) + ' h';
  return (s / 86400).toFixed(1) + ' days';
}

/* ── boot ────────────────────────────────────────────────────────────────── */
async function boot() {
  try {
    CFG = await get('/api/config');
  } catch (e) {
    $('boot').innerHTML = `<div class="err"><b>Cannot reach the API.</b><br>
      Start it with <code>python3 -m ecm1240.api</code>, then reload.<br>
      <span style="color:var(--dim)">${esc(e.message)}</span></div>`;
    $('status').textContent = 'offline';
    return;
  }
  $('site').textContent = CFG.site_name || 'Energy Monitor';
  document.title = (CFG.site_name || 'Energy') + ' — Energy Monitor';
  if (!CFG.mains) $('heroLbl').textContent = 'Metered Total';
  $('hero').hidden = false;
  $('hero').onclick = () => openChart(houseSeries());
  $('hero').onkeydown = e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openChart(houseSeries()); }
  };
  buildCards();
  buildVoltCards();
  await tick();
  setInterval(tick, 5000);
  loadInsights();
  setInterval(loadInsights, 300000);
  window.addEventListener('hashchange', routeFromHash);
  routeFromHash();
}

function houseSeries() {
  if (CFG.mains) {
    return { unit: CFG.mains.unit, channel: CFG.mains.channel,
             name: $('heroLbl').textContent, key: '__house' };
  }
  return null;                   // no mains channel: nothing single to chart
}

function buildCards() {
  const g = $('grid');
  g.innerHTML = '';
  for (const c of CFG.channels || []) {
    if (c.role === 'mains') continue;             // shown in the hero instead
    const el = document.createElement('div');
    el.className = 'card' + (c.hidden ? ' hidden-ch' : '');
    el.tabIndex = 0;
    el.dataset.key = c.key;
    el.innerHTML = `
      <div class="name">${esc(c.name)}${c.hidden ? '<span class="tag">hidden</span>' : ''}</div>
      <div class="w" data-w>—</div>
      <div class="meta">${c.volts} V${c.note ? ' · ' + esc(c.note) : ''}</div>
      <div class="bar"><i data-bar style="width:0"></i></div>`;
    const open = () => openChart(c);
    el.onclick = open;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
    g.appendChild(el);
  }
}

/* A meter's line voltage behaves as a chartable series but is not a circuit —
   it has no CT, no cost and no role in any total. Rather than teach the config
   about it, one is synthesised per meter that actually reports readings, using
   the same shape the real channels have so openChart, the router and the chart
   need no special case beyond the axis. */
const VOLT_KEY = u => `__volts${u}`;
function voltChannel(unit) {
  return { unit, channel: 'volts', key: VOLT_KEY(unit), metric: 'volts',
           name: `Meter ${unit} · line voltage`, role: 'volts', volts: '' };
}
function meterUnits() {
  return [...new Set((CFG.channels || []).map(c => c.unit))].sort((a, b) => a - b);
}

function buildVoltCards() {
  const g = $('volts');
  g.innerHTML = '';
  const units = meterUnits();
  $('voltH').hidden = !units.length;
  for (const u of units) {
    const c = voltChannel(u);
    const el = document.createElement('div');
    el.className = 'card';
    el.tabIndex = 0;
    el.dataset.key = c.key;
    el.innerHTML = `
      <div class="name">${esc(c.name)}</div>
      <div class="w" data-v>—</div>
      <div class="meta">tap for voltage history</div>`;
    const open = () => openChart(c);
    el.onclick = open;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
    g.appendChild(el);
  }
}

/* ── live poll ───────────────────────────────────────────────────────────── */
// /api/snapshot returns the same latest-reading-per-meter as /api/now, plus a
// time-aligned unmetered figure computed over one shared window — which is the
// only way to get that number right when two meters sample on their own clocks
// (see snapshot() in ecm1240/api.py). An older API answers 404, so the first
// 404 latches the fallback and we stop asking; anything else is a real network
// problem and is left to the caller.
let haveSnapshot = true;
async function liveRows() {
  if (haveSnapshot) {
    try {
      const s = await get('/api/snapshot');
      return { rows: s.units || [], aligned: s.aligned || null };
    } catch (e) {
      if (!/HTTP 404/.test(e.message)) throw e;
      haveSnapshot = false;
    }
  }
  return { rows: await get('/api/now'), aligned: null };
}

async function tick() {
  let rows, aligned;
  try {
    ({ rows, aligned } = await liveRows());
  } catch (e) {
    $('status').textContent = 'connection lost — retrying';
    return;
  }
  LAST = {};
  for (const r of rows) LAST[r.unit_id] = r;

  const chans = CFG.channels || [];
  const wattOf = c => { const row = LAST[c.unit]; return row ? row[c.channel] : null; };

  // Whole-house figure: the mains channel if one is configured, otherwise the
  // sum of the metered branches. Which one it is matters — the sum cannot see
  // anything that has no CT on it.
  let house = null;
  if (CFG.mains) {
    const row = LAST[CFG.mains.unit];
    house = row ? row[CFG.mains.channel] : null;
  }
  if (house == null) {
    house = chans.filter(c => c.role !== 'mains')
                 .reduce((a, c) => a + (wattOf(c) || 0), 0);
  }
  $('heroW').textContent = fmtW(house);

  const rate = CFG.rate_per_kwh || 0;
  const sym = CFG.currency_symbol || '$';
  if (rate && house != null) {
    $('heroCost').textContent =
      `≈ ${sym}${(house / 1000 * 24 * rate).toFixed(2)}/day at this rate · ${sym}${rate}/kWh`;
  }

  // How much of the house has no CT on it. Shown only when it is big enough to
  // mean something: inside the noise band it is CT tolerance rather than a
  // load, and a number that wanders either side of zero invites reading meaning
  // into noise. Insights judges whether a large gap is persistent; this is just
  // the live figure.
  const unmet = $('heroUnmet');
  const uw = aligned && typeof aligned.unmetered_w === 'number' ? aligned.unmetered_w : null;
  const noiseHi = CFG.unmetered_noise_high_w != null ? CFG.unmetered_noise_high_w : 100;
  if (uw != null && uw > noiseHi) {
    unmet.innerHTML = `${esc(CFG.unmetered_label || 'Unmetered')}: <b>${fmtW(uw)}</b>` +
      ` — on the mains but not on any CT`;
    unmet.hidden = false;
  } else {
    unmet.hidden = true;
  }

  const peak = Math.max(1, ...chans.filter(c => c.role !== 'mains').map(c => wattOf(c) || 0));
  for (const c of chans) {
    if (c.role === 'mains') continue;
    const el = document.querySelector(`.card[data-key="${CSS.escape(c.key)}"]`);
    if (!el) continue;
    const w = wattOf(c);
    el.querySelector('[data-w]').textContent = fmtW(w);
    el.querySelector('[data-bar]').style.width =
      Math.min(100, ((w || 0) / peak) * 100) + '%';
  }

  for (const u of meterUnits()) {
    const el = document.querySelector(`.card[data-key="${CSS.escape(VOLT_KEY(u))}"]`);
    if (!el) continue;
    const v = LAST[u] ? LAST[u].volts : null;
    // Below the dead line the meter has lost its own supply and reads toward
    // zero. Saying so beats printing a voltage that was never on the service.
    el.querySelector('[data-v]').textContent =
      v == null ? '—' : v < deadBelow() ? 'no supply' : fmtV(v);
  }

  // The live figure keeps updating while a chart is open.
  if (CH.open) {
    const row = LAST[CH.ch.unit];
    const v = row ? row[CH.ch.channel] : null;
    $('chartNow').textContent = v == null ? ''
      : (CH.ch.metric === 'volts' ? fmtV(v) : fmtW(v)) + ' now';
  }

  const age = rows.length
    ? Math.round(Date.now() / 1000 - Math.max(...rows.map(r => r.ts))) : null;
  $('status').textContent = age == null ? 'no data yet'
    : age > 60 ? `last reading ${age}s ago — collector may be stopped`
    : `live · updated ${age}s ago`;
}

/* ── zoomable chart ──────────────────────────────────────────────────────
   Two datasets are kept:
     overview  the whole selected range at low resolution, for the strip
     detail    the currently visible window, re-fetched from the API

   Zooming RE-ASKS the server for that window rather than stretching what is
   already loaded, so pulling one evening open shows real detail instead of a
   magnified average. That is the whole point of the exercise; the drawing is
   incidental. */
const CH = {
  open: false, ch: null, rangeIdx: DEFAULT_RANGE,
  base: null,      // {t0,t1} the range button's window
  view: null,      // {t0,t1} what is on screen
  overview: [], detail: [], loading: false, reqSeq: 0,
};

function openChart(ch) {
  if (!ch) return;
  location.hash = `#/chart/${ch.unit}/${ch.channel}`;
}

function closeChart() {
  if (location.hash) location.hash = '';
  else showDash();
}

function routeFromHash() {
  const m = /^#\/chart\/(\d+)\/(\w+)$/.exec(location.hash || '');
  if (!m) { showDash(); return; }
  const unit = +m[1], channel = m[2];
  let ch = channel === 'volts' && meterUnits().includes(unit)
    ? voltChannel(unit)
    : (CFG.channels || []).find(c => c.unit === unit && c.channel === channel);
  if (!ch) { showDash(); return; }
  startChart(ch);
}

function showDash() {
  CH.open = false;
  document.body.classList.remove('charting');
}

function startChart(ch) {
  CH.open = true; CH.ch = ch;
  document.body.classList.add('charting');
  $('chartTitle').textContent = ch.role === 'mains'
    ? ($('heroLbl').textContent || ch.name) : ch.name;
  buildRanges();
  setRange(CH.rangeIdx);
}

function buildRanges() {
  const r = $('ranges');
  r.innerHTML = '';
  RANGES.forEach((rg, i) => {
    const b = document.createElement('button');
    b.textContent = rg.label;
    b.setAttribute('aria-pressed', String(i === CH.rangeIdx));
    b.onclick = () => setRange(i);
    r.appendChild(b);
  });
  const reset = document.createElement('button');
  reset.textContent = 'Reset zoom';
  reset.id = 'resetBtn';
  reset.onclick = () => { CH.view = { ...CH.base }; loadDetail(); };
  r.appendChild(reset);
}

async function setRange(i) {
  CH.rangeIdx = i;
  const now = Math.floor(Date.now() / 1000);
  CH.base = { t0: now - RANGES[i].minutes * 60, t1: now };
  CH.view = { ...CH.base };
  buildRanges();
  await loadOverview();
  await loadDetail();
}

function plotWidth() {
  const el = $('plot');
  return Math.max(320, Math.min(el.clientWidth || 860, 1400));
}

async function loadOverview() {
  const { t0, t1 } = CH.base;
  try {
    const d = await get(`/api/history?channel=${CH.ch.channel}&unit=${CH.ch.unit}` +
      `&minutes=${Math.round((t1 - t0) / 60)}&end=${t1}&points=320`);
    CH.overview = (d.points || []).filter(p => p.w != null);
  } catch (e) { CH.overview = []; }
}

let detailTimer = null;
function loadDetailDebounced() {
  clearTimeout(detailTimer);
  detailTimer = setTimeout(loadDetail, 220);
  draw();                        // redraw immediately from what we have
}

async function loadDetail() {
  const seq = ++CH.reqSeq;
  const { t0, t1 } = CH.view;
  const minutes = Math.max(1, Math.round((t1 - t0) / 60));
  // Ask for roughly one point per pixel, capped by the API at 1000.
  const points = Math.min(1000, Math.max(60, Math.round(plotWidth())));
  CH.loading = true;
  draw();
  try {
    const d = await get(`/api/history?channel=${CH.ch.channel}&unit=${CH.ch.unit}` +
      `&minutes=${minutes}&end=${t1}&points=${points}`);
    if (seq !== CH.reqSeq) return;             // a newer request already won
    CH.detail = (d.points || []).filter(p => p.w != null);
    CH.bucket = d.bucket_s;
  } catch (e) {
    if (seq === CH.reqSeq) CH.detail = [];
  } finally {
    if (seq === CH.reqSeq) { CH.loading = false; draw(); }
  }
}

/* Where the readings stop, and where they start again.

   Two different things leave a hole in a series and both must draw as one.
   The API buckets with GROUP BY, so a stretch with no rows produces no points
   at all — a power cut, a crashed collector, an unplugged meter. Separately it
   returns an explicit null for a bucket in which every sample was scrubbed as
   dead (see the history endpoint: a meter that has lost its own supply reads
   toward zero, and that is a dead meter, not a brownout). Those nulls are
   dropped on the way in, which widens the spacing here — so testing the TIME
   between surviving readings catches both without caring which happened.

   "Normal spacing" is the MEDIAN gap, never the first one. Taking gaps[0] as
   the bucket size lets a single outage at the start of a range redefine normal
   for the whole range; the middle value cannot be dragged by a few big gaps. */
const GAP_FACTOR = 2;            // a hole this many buckets wide breaks the line
function splitRuns(pts) {
  if (pts.length < 3) return pts.length ? [pts] : [];
  const gaps = pts.slice(1).map((p, i) => p.ts - pts[i].ts).sort((a, b) => a - b);
  const step = gaps[gaps.length >> 1];
  if (!step) return [pts];
  const runs = [[pts[0]]];
  for (let i = 1; i < pts.length; i++) {
    if (pts[i].ts - pts[i - 1].ts > step * GAP_FACTOR) runs.push([]);
    runs[runs.length - 1].push(pts[i]);
  }
  return runs;
}

function draw() {
  const W = 900, H = 320, SH = 56;               // plot + strip heights
  const L = 66, R = 14, T = 14, B = 30, SGAP = 16;
  const totalH = H + SGAP + SH + 22;
  const pts = CH.detail;
  const { t0, t1 } = CH.view;

  if (!pts.length && !CH.loading) {
    $('plot').innerHTML =
      '<div style="color:var(--dim);padding:40px 0;text-align:center">' +
      'No data in this range.</div>';
    updateChartMeta();
    return;
  }

  /* Watts are measured FROM zero, so a watt axis starts at zero — halving a
     bar has to look like halving. Volts are not: a service never goes near
     zero, so a zero-based voltage axis draws every reading as the same flat
     line across the top and hides exactly the sag or swell worth seeing. The
     voltage axis hugs the data instead, snapped out to whole volts so the
     labels stay readable, with a floor on the span so a dead-calm supply does
     not get magnified into dramatic-looking noise. */
  const isVolts = CH.ch.metric === 'volts';
  const fmtY = isVolts ? fmtV : fmtW;
  let lo = 0, hi = Math.max(1, ...pts.map(p => p.w));
  if (isVolts && pts.length) {
    const dLo = Math.min(...pts.map(p => p.w)), dHi = Math.max(...pts.map(p => p.w));
    lo = Math.floor(dLo - 0.5);
    hi = Math.ceil(dHi + 0.5);
    if (hi - lo < 2) { const mid = (hi + lo) / 2; lo = Math.floor(mid - 1); hi = lo + 2; }
  }
  const x = t => L + (t - t0) / Math.max(t1 - t0, 1) * (W - L - R);
  const y = w => T + (1 - (w - lo) / Math.max(hi - lo, 1e-9)) * (H - T - B);

  /* One path per RUN of adjacent readings, not one path through everything.
     A single path joins its last point to its next with a straight line, so a
     recording gap gets drawn as a confident, dead-level trace across hours
     nobody measured — on a voltage chart that reads as an unusually steady
     supply, which is the exact opposite of a meter that stopped. */
  const runs = splitRuns(pts);
  const seg = run => run.map((p, i) =>
    (i ? 'L' : 'M') + x(p.ts).toFixed(1) + ',' + y(p.w).toFixed(1)).join('');
  const line = runs.map(seg).join('');
  // Filling to the baseline says "this much of something". On a voltage axis
  // the baseline is an arbitrary crop, so the fill would be shading nothing.
  // Each run is closed on its own, so a gap is a gap in the fill too rather
  // than one polygon stretched over the hole.
  const area = isVolts ? '' : runs.map(run =>
    seg(run) + `L${x(run[run.length - 1].ts).toFixed(1)},${y(lo).toFixed(1)}` +
               `L${x(run[0].ts).toFixed(1)},${y(lo).toFixed(1)}Z`).join('');

  /* Shade what is OUT of range, not what is in it. Because the axis hugs the
     data, a healthy service fills the plot — tinting the in-range band would
     wash the whole chart in colour that means "nothing is wrong", which is the
     one thing not worth drawing. Shading the outside instead means colour
     appears only when the voltage actually reaches a limit, and the amount of
     it is the size of the excursion. */
  let band = '';
  if (isVolts) {
    const b = voltBand();
    const shade = (yTop, yBot) =>
      `<rect x="${L}" y="${yTop.toFixed(1)}" width="${W - L - R}"
             height="${(yBot - yTop).toFixed(1)}" fill="var(--bad, #c0392b)" opacity="0.10"/>`;
    if (hi > b.high) band += shade(y(hi), y(b.high));      // swell
    if (lo < b.low) band += shade(y(b.low), y(lo));        // sag
  }

  let grid = '';
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, yy = y(v);
    grid += `<line x1="${L}" y1="${yy.toFixed(1)}" x2="${W - R}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    grid += `<text x="${L - 9}" y="${(yy + 5).toFixed(1)}" text-anchor="end" font-size="13" fill="var(--dim)">${fmtY(v)}</text>`;
  }
  const span = t1 - t0;
  let ticks = '';
  for (let i = 0; i <= 5; i++) {
    const t = t0 + span * i / 5;
    const anchor = i === 0 ? 'start' : i === 5 ? 'end' : 'middle';
    ticks += `<text x="${x(t).toFixed(1)}" y="${H - 8}" text-anchor="${anchor}" font-size="13" fill="var(--dim)">${esc(fmtTime(t, span))}</text>`;
  }

  // ── overview strip: the whole range, with the visible window highlighted
  const sy = H + SGAP;
  const ov = CH.overview;
  const b0 = CH.base.t0, b1 = CH.base.t1;
  const sx = t => L + (t - b0) / Math.max(b1 - b0, 1) * (W - L - R);
  let strip = '';
  if (ov.length) {
    // The strip needs its own domain: it shows the WHOLE range, not the zoomed
    // window, and on a voltage axis scaling it from zero would flatten it into
    // a straight line and make the navigator useless for finding an event.
    let oLo = 0, oHi = Math.max(1, ...ov.map(p => p.w));
    if (isVolts) {
      oLo = Math.min(...ov.map(p => p.w));
      if (oHi - oLo < 1) { oHi = oLo + 1; }
    }
    // Broken across gaps for the same reason as the plot, and the navigator is
    // where it matters most: a hole is what you drag the window onto to find
    // out what happened, and it can only be aimed at if it is visible.
    const sp = splitRuns(ov).map(run => run.map((p, i) =>
      (i ? 'L' : 'M') + sx(p.ts).toFixed(1) + ',' +
      (sy + SH - ((p.w - oLo) / (oHi - oLo)) * (SH - 6)).toFixed(1)).join('')).join('');
    strip = `<path d="${sp}" fill="none" stroke="var(--dim)" stroke-width="1.2" opacity="0.75"/>`;
  }
  const selX0 = sx(Math.max(t0, b0)), selX1 = sx(Math.min(t1, b1));

  $('plot').innerHTML = `
  <svg id="svg" viewBox="0 0 ${W} ${totalH}" role="img"
       aria-label="${esc(CH.ch.name)} ${isVolts ? 'line voltage' : 'power'}, ${esc(fmtSpan(span))} shown">
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="plotArea"/>
    ${band}
    ${grid}
    ${area ? `<path d="${area}" fill="var(--accent)" opacity="0.16"/>` : ''}
    ${line ? `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"
          stroke-linejoin="round" stroke-linecap="round"/>` : ''}
    ${ticks}
    <rect id="selBox" x="0" y="${T}" width="0" height="${H - T - B}"
          fill="var(--accent)" opacity="0.22" style="display:none"/>
    ${CH.loading ? `<text x="${W / 2}" y="${T + 18}" text-anchor="middle" font-size="13" fill="var(--dim)">loading…</text>` : ''}

    <!-- overview strip -->
    <rect x="${L}" y="${sy}" width="${W - L - R}" height="${SH}"
          fill="var(--panel2)" stroke="var(--line)" rx="4"/>
    ${strip}
    <rect id="sel" x="${selX0.toFixed(1)}" y="${sy}" width="${Math.max(2, selX1 - selX0).toFixed(1)}"
          height="${SH}" fill="var(--accent)" opacity="0.25" style="cursor:grab"/>
    <rect id="selL" x="${(selX0 - 4).toFixed(1)}" y="${sy}" width="8" height="${SH}"
          fill="var(--accent)" opacity="0.85" rx="2" style="cursor:ew-resize"/>
    <rect id="selR" x="${(selX1 - 4).toFixed(1)}" y="${sy}" width="8" height="${SH}"
          fill="var(--accent)" opacity="0.85" rx="2" style="cursor:ew-resize"/>
    <text x="${L}" y="${sy + SH + 16}" font-size="12" fill="var(--dim)">${esc(fmtTime(b0, b1 - b0))}</text>
    <text x="${W - R}" y="${sy + SH + 16}" text-anchor="end" font-size="12" fill="var(--dim)">${esc(fmtTime(b1, b1 - b0))}</text>
  </svg>`;

  wireInteractions({ W, H, L, R, T, B, sy, SH, b0, b1 });
  updateChartMeta();
}

function updateChartMeta() {
  const { t0, t1 } = CH.view;
  const span = t1 - t0;
  const zoomed = Math.abs(span - (CH.base.t1 - CH.base.t0)) > 5;
  // Say the silence out loud. The line breaks where the readings stop, but a
  // break can be mistaken for a quiet patch in the wiggle — and when the hole
  // runs right up to the edge of the range there is no break to see at all,
  // just a chart that quietly begins late. Both are the same fact.
  const holes = Math.max(0, splitRuns(CH.detail).length - 1);
  const gapNote = holes
    ? ` · <span style="color:var(--bad, #c0392b)">${holes} break${holes !== 1 ? 's' : ''}` +
      ` where the meter stopped recording</span>` : '';
  $('zoomLbl').innerHTML = (zoomed
    ? `Showing <b>${esc(fmtSpan(span))}</b> — ${esc(fmtTime(t0, span))} to ${esc(fmtTime(t1, span))}` +
      (CH.bucket ? ` · ${CH.bucket}s resolution` : '')
    : (CH.bucket ? `${CH.bucket}s resolution` : '')) + gapNote;
  const rb = $('resetBtn');
  if (rb) rb.style.display = zoomed ? '' : 'none';

  const pts = CH.detail;
  if (!pts.length) { $('stats').innerHTML = ''; return; }
  const avg = pts.reduce((a, p) => a + p.w, 0) / pts.length;
  const peak = Math.max(...pts.map(p => p.w));
  // Voltage has no energy and no cost, and its useful extreme is the LOW one —
  // a sag is what dims lights and stalls motors. kWh of volts would be nonsense.
  if (CH.ch.metric === 'volts') {
    const b = voltBand();
    const min = Math.min(...pts.map(p => p.w));
    const out = pts.filter(p => p.w < b.low || p.w > b.high).length;
    $('stats').innerHTML =
      `<span><b>${fmtV(avg)}</b> <span style="color:var(--dim)">average</span></span>
       <span><b>${fmtV(min)}</b> <span style="color:var(--dim)">lowest</span></span>
       <span><b>${fmtV(peak)}</b> <span style="color:var(--dim)">highest</span></span>
       <span><b>${out ? Math.round(out / pts.length * 100) + '%' : 'none'}</b>
         <span style="color:var(--dim)">outside ${fmtV(b.low)}–${fmtV(b.high)}</span></span>`;
    return;
  }
  const kwh = avg / 1000 * (span / 3600);
  const sym = CFG.currency_symbol || '$';
  const rate = CFG.rate_per_kwh || 0;
  $('stats').innerHTML =
    `<span><b>${fmtW(avg)}</b> <span style="color:var(--dim)">average</span></span>
     <span><b>${fmtW(peak)}</b> <span style="color:var(--dim)">peak</span></span>
     <span><b>${kwh.toFixed(2)} kWh</b> <span style="color:var(--dim)">over ${esc(fmtSpan(span))}</span></span>
     ${rate ? `<span><b>${sym}${(kwh * rate).toFixed(2)}</b> <span style="color:var(--dim)">estimated</span></span>` : ''}`;
}

/* Interactions are wired fresh each draw because the SVG is rebuilt. Pointer
   events cover mouse, touch and pen with one code path. */
function wireInteractions(G) {
  const svg = $('svg');
  if (!svg) return;
  const { W, L, R, T, H, B, sy, SH, b0, b1 } = G;

  const toSvgX = ev => {
    const r = svg.getBoundingClientRect();
    return (ev.clientX - r.left) / r.width * W;
  };
  const inPlot = ev => {
    const r = svg.getBoundingClientRect();
    const yy = (ev.clientY - r.top) / r.height * (H + 16 + SH + 22);
    return yy >= T && yy <= H - B;
  };
  const pxToTime = (px, x0, x1, t0, t1) =>
    t0 + (Math.min(Math.max(px, x0), x1) - x0) / (x1 - x0) * (t1 - t0);

  const clampView = (t0, t1) => {
    let span = Math.max(MIN_SPAN_S, t1 - t0);
    if (span > b1 - b0) span = b1 - b0;
    if (t0 < b0) { t0 = b0; t1 = b0 + span; }
    if (t1 > b1) { t1 = b1; t0 = b1 - span; }
    return { t0: Math.round(t0), t1: Math.round(t1) };
  };

  // ── drag across the plot to select a zoom window
  let dragX0 = null;
  const selBox = svg.querySelector('#selBox');
  svg.addEventListener('pointerdown', ev => {
    if (ev.target.id === 'sel' || ev.target.id === 'selL' || ev.target.id === 'selR') return;
    if (!inPlot(ev)) return;
    dragX0 = toSvgX(ev);
    svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener('pointermove', ev => {
    if (dragX0 == null) return;
    const x1 = toSvgX(ev);
    const a = Math.min(dragX0, x1), b = Math.max(dragX0, x1);
    selBox.setAttribute('x', a.toFixed(1));
    selBox.setAttribute('width', Math.max(0, b - a).toFixed(1));
    selBox.style.display = (b - a) > 3 ? '' : 'none';
  });
  svg.addEventListener('pointerup', ev => {
    if (dragX0 == null) return;
    const x1 = toSvgX(ev);
    const a = Math.min(dragX0, x1), b = Math.max(dragX0, x1);
    dragX0 = null;
    selBox.style.display = 'none';
    if (b - a < 6) return;                        // a tap, not a drag
    const { t0, t1 } = CH.view;
    const nt0 = pxToTime(a, L, W - R, t0, t1);
    const nt1 = pxToTime(b, L, W - R, t0, t1);
    CH.view = clampView(nt0, nt1);
    loadDetail();
  });

  // ── wheel to zoom around the cursor
  svg.addEventListener('wheel', ev => {
    if (!inPlot(ev)) return;
    ev.preventDefault();
    const { t0, t1 } = CH.view;
    const at = pxToTime(toSvgX(ev), L, W - R, t0, t1);
    const k = ev.deltaY > 0 ? 1.25 : 0.8;
    CH.view = clampView(at - (at - t0) * k, at + (t1 - at) * k);
    loadDetailDebounced();
  }, { passive: false });

  // ── drag the strip selection to pan, or its edges to resize
  const sel = svg.querySelector('#sel');
  const selL = svg.querySelector('#selL');
  const selR = svg.querySelector('#selR');
  let mode = null, grabT = null, startView = null;

  const stripTime = px => pxToTime(px, L, W - R, b0, b1);

  const beginStrip = (ev, m) => {
    ev.stopPropagation();
    mode = m; grabT = stripTime(toSvgX(ev)); startView = { ...CH.view };
    svg.setPointerCapture(ev.pointerId);
  };
  sel.addEventListener('pointerdown', ev => beginStrip(ev, 'pan'));
  selL.addEventListener('pointerdown', ev => beginStrip(ev, 'left'));
  selR.addEventListener('pointerdown', ev => beginStrip(ev, 'right'));

  svg.addEventListener('pointermove', ev => {
    if (!mode) return;
    const t = stripTime(toSvgX(ev));
    const d = t - grabT;
    if (mode === 'pan') {
      CH.view = clampView(startView.t0 + d, startView.t1 + d);
    } else if (mode === 'left') {
      CH.view = clampView(Math.min(t, startView.t1 - MIN_SPAN_S), startView.t1);
    } else {
      CH.view = clampView(startView.t0, Math.max(t, startView.t0 + MIN_SPAN_S));
    }
    draw();
  });
  const endStrip = () => { if (mode) { mode = null; loadDetail(); } };
  svg.addEventListener('pointerup', endStrip);
  svg.addEventListener('pointercancel', endStrip);
}

let resizeTimer = null;
window.addEventListener('resize', () => {
  if (!CH.open) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(loadDetail, 250);
});

/* ── insights ────────────────────────────────────────────────────────────── */
async function loadInsights() {
  let d;
  try { d = await get('/api/insights'); } catch (e) { return; }
  const cards = d.cards || [];
  if (!cards.length) { $('insH').hidden = true; $('ins').innerHTML = ''; return; }
  $('insH').hidden = false;
  $('ins').innerHTML = cards.map(c => `
    <div class="ins ${esc(c.level)}">
      <div class="t">${esc(c.title)}${c.stat ? `<span class="tag">${esc(c.stat)}</span>` : ''}</div>
      <div class="d">${esc(c.detail)}</div>
    </div>`).join('') +
    (d.stale ? `<div class="ins info"><div class="d">These findings are
      ${Math.round((d.age_s || 0) / 60)} minutes old — the insights job may have
      stopped running.</div></div>` : '');
}

boot();
</script>
</body>
</html>
